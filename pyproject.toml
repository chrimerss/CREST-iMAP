[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "crestimap"
version = "2.0.0.dev0"
description = "CREST-iMAP v2: differentiable well-balanced 2-D shallow-water flood model (PyTorch)"
requires-python = ">=3.10"
dependencies = ["torch>=2.0", "numpy"]

[project.optional-dependencies]
geo = ["rasterio"]
test = ["pytest"]

[tool.setuptools]
packages = ["crestimap"]
